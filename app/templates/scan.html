{% extends "layout.html" %}
{% block content %}
    <div class="content-section">
        <legend class="border-bottom mb-4">Scan QR Code</legend>
        <div id="qr-reader" style="width: 500px"></div>
        <div id="qr-reader-results"></div>
    </div>
{% endblock content %}
{% block scripts %}
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // handle the scanned code as you like, for example:
            console.log(`Code matched = ${decodedText}`, decodedResult);

            // Redirect back to the return page with the scanned QR code
            // This is a simplified example. In a real app, you might want to
            // pass the data back more elegantly, e.g. using window.opener
            // or a shared state management solution.

            // For now, we'll just alert the user and they can manually enter it.
            alert(`Scanned QR Code: ${decodedText}`);

            // A more advanced implementation could try to find the opener window
            // and set the value of the input field.
            if (window.opener) {
                window.opener.document.getElementById('qr_code_input').value = decodedText;
                window.opener.document.getElementById('qr_code_input').dispatchEvent(new Event('change'));
                window.close();
            }
        }

        function onScanFailure(error) {
            // handle scan failure, usually better to ignore and keep scanning.
            // for example:
            // console.warn(`Code scan error = ${error}`);
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "qr-reader",
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
{% endblock %}
